# Shared settings first; the sections below add per-profile settings.
# Pick a profile with SPRING_PROFILES_ACTIVE (dev | test | prod).
# Credentials only ever come from environment variables (see .env.example).
spring:
  application:
    name: hisaab-api
  datasource:
    # The API connects as hisaab_app: no table ownership, no BYPASSRLS.
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    # Migrations run at startup as hisaab_owner, which owns the schema.
    url: ${DB_URL}
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks entities match it.
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE
  # Outbound email over SMTP (Brevo in production; see .env.example). Nothing connects until the
  # digest actually sends, which needs app.mail.from below.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Without timeouts a dead mail server would hold a job (and its transaction) open.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  web-origin: ${WEB_ORIGIN}
  jwt-secret: ${JWT_SECRET}
  mail:
    # The sender of the dues digest. Blank = the digest is not sent (local dev default).
    from: ${MAIL_FROM:}

server:
  # "native": Tomcat honours X-Forwarded-For only when the request comes from a
  # trusted (private-network) proxy, such as the Next.js server or the hosting
  # load balancer. A public caller cannot fake their IP to dodge rate limits.
  forward-headers-strategy: native

---
spring:
  config:
    activate:
      on-profile: dev
    # Reads apps/api/.env (KEY=value lines) if it exists; real environment
    # variables take precedence.
    import: optional:file:.env[.properties]

---
spring:
  config:
    activate:
      on-profile: test
# Database settings are injected by the Testcontainers base class.
app:
  web-origin: http://localhost:3000
  # Tests run the job poller by hand so they are deterministic.
  jobs:
    enabled: false
  # Test-only key; not a secret.
  jwt-secret: test-only-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz

---
spring:
  config:
    activate:
      on-profile: prod
# No API docs or Swagger UI in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
